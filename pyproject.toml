[project]
name = "football-player-lab"
version = "1.0.0"
description = "Reproducible football player profiles, per-90 comparisons and zone analysis"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
player-lab = "player_lab.cli:main"
[tool.setuptools.packages.find]
include = ["player_lab*"]
